services:
  chat-app:
    build:
      context: ./chat   # your Next.js project folder
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./chat:/app         # mount project for hot reload
      - /app/node_modules   # prevent overwriting installed modules
    environment:
      - NEXT_PUBLIC_OLLAMA_API_URL=http://ollama-runtime:11434
    depends_on:
      - ollama-runtime

  ollama-runtime:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      sh -c "
        ollama serve &
        sleep 2 &&
        ollama run qwen 'Hello' > /dev/null &&
        wait
      "   

volumes:
  ollama_data:
